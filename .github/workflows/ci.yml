name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest

  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check out the exact Core contract provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cirwel/unitares
          # Core v4.1.0 release commit (tag v4.1.0, cirwel/unitares#3358),
          # which ships interface contract 2.5.0. Pinning a specific commit
          # keeps this consumer gate reproducible; advance it whenever
          # docs/interface-contract.v1.json changes on Core's default branch
          # (contract-drift.yml reports when it has — see that workflow for
          # why this pin needs a reporter at all: it already shipped once
          # pointing at a pre-merge draft commit whose surface_sha256 didn't
          # match what actually merged).
          ref: 56a674bfedc7e4a41e31fcb9ab162a43e7e9dab8
          path: .contract/core
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate Core's public machine contract
        run: >-
          uv run python scripts/check_core_contract.py
          .contract/core/docs/interface-contract.v1.json
