name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest

  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact Core contract provider
        uses: actions/checkout@v4
        with:
          repository: cirwel/unitares
          # Contract-producing commit from the merged Core PR
          # (cirwel/unitares#1908). Pinning a specific commit keeps this
          # consumer gate reproducible; advance it whenever
          # docs/interface-contract.v1.json changes on Core's default branch
          # (contract-drift.yml reports when it has — see that workflow for
          # why this pin needs a reporter at all: it already shipped once
          # pointing at a pre-merge draft commit whose surface_sha256 didn't
          # match what actually merged).
          ref: a2a6635057f7893b8c1fb173651b3d2793f98405
          path: .contract/core
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate Core's public machine contract
        run: >-
          uv run python scripts/check_core_contract.py
          .contract/core/docs/interface-contract.v1.json
