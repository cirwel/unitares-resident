[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unitares-resident"
version = "0.1.0a1"
description = "First-party agent userland for UNITARES, built on the public SDK contract"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "cirwel" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "unitares-sdk>=0.2.2,<0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
unitares-resident = "unitares_resident.cli:main"

[project.urls]
Homepage = "https://github.com/cirwel/unitares-resident"
Source = "https://github.com/cirwel/unitares-resident"
Issues = "https://github.com/cirwel/unitares-resident/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/unitares_resident"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
